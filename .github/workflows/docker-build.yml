name: Docker Build

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  docker-build:
    name: Build Frappe v16 image
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Railway shell scripts
        run: |
          bash -n scripts/railway-entrypoint.sh
          bash -n scripts/railway-bootstrap.sh
          bash -n scripts/railway-install-hrms.sh
          bash -n scripts/railway-migrate.sh
          bash -n scripts/railway-start-all.sh

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: al-rana-tms:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify bundled Frappe apps
        run: |
          docker run --rm --entrypoint bash al-rana-tms:${{ github.sha }} -lc '
            set -euo pipefail
            cd /home/frappe/frappe-bench

            test -d apps/transport_management
            test -d apps/dispatch_portal
            test -f apps/transport_management/transport_management/hooks.py
            test -f apps/dispatch_portal/dispatch_portal/hooks.py
            test -x railway-start-all.sh
            bash -n railway-start-all.sh

            grep -qx "frappe" sites/apps.txt
            grep -qx "erpnext" sites/apps.txt
            grep -qx "transport_management" sites/apps.txt
            grep -qx "dispatch_portal" sites/apps.txt

            ./env/bin/python - <<PY
          import importlib.util

          for app in ("transport_management", "dispatch_portal"):
              if importlib.util.find_spec(app) is None:
                  raise SystemExit(f"{app} is not importable")
              print(f"{app}: importable")
          PY
          '

      - name: Verify Railway sites-volume initialization
        run: |
          docker run --rm \
            --tmpfs /home/frappe/frappe-bench/sites \
            --entrypoint bash \
            al-rana-tms:${{ github.sha }} \
            -lc '
              set -euo pipefail

              sites=/home/frappe/frappe-bench/sites
              mkdir -p "$sites/assets" "$sites/tms.localhost"
              printf "existing site data\n" > "$sites/tms.localhost/preserved.txt"
              printf "existing asset\n" > "$sites/assets/volume-only.txt"
              printf "{\"volume_preserved\": true}\n" > "$sites/common_site_config.json"

              test "$(stat -c %u "$sites")" = 0
              echo "Frappe runtime UID:GID: $(id -u frappe):$(id -g frappe)"

              verify="set -euo pipefail
              test \$(id -u) = \$(id -u frappe)
              test \$(id -g) = \$(id -g frappe)
              test \$(stat -c %u /home/frappe/frappe-bench/sites) = \$(id -u frappe)
              test \$(stat -c %u /home/frappe/frappe-bench/sites/assets) = \$(id -u frappe)
              test -f /home/frappe/frappe-bench/sites/apps.txt
              test \$(grep -xc frappe /home/frappe/frappe-bench/sites/apps.txt) = 1
              test -f /home/frappe/frappe-bench/sites/tms.localhost/preserved.txt
              test -f /home/frappe/frappe-bench/sites/assets/volume-only.txt
              grep -q volume_preserved /home/frappe/frappe-bench/sites/common_site_config.json"

              /home/frappe/frappe-bench/railway-entrypoint.sh bash -c "$verify"
              /home/frappe/frappe-bench/railway-entrypoint.sh bash -c "$verify"
            '

      - name: Verify Railway pre-restore startup skips site cache
        run: |
          docker run --rm \
            --tmpfs /home/frappe/frappe-bench/sites \
            --entrypoint bash \
            al-rana-tms:${{ github.sha }} \
            -lc '
              set -euo pipefail

              export FRAPPE_SITE=tms-staging
              /home/frappe/frappe-bench/railway-entrypoint.sh \
                bash -lc "test ! -d /home/frappe/frappe-bench/sites/tms-staging && echo gunicorn pre-restore startup ok"
            '

      - name: Verify Railway restored-site startup clears cache
        run: |
          docker run --rm \
            --tmpfs /home/frappe/frappe-bench/sites \
            --tmpfs /railway-test \
            --entrypoint bash \
            al-rana-tms:${{ github.sha }} \
            -lc '
              set -euo pipefail

              sites=/home/frappe/frappe-bench/sites
              mkdir -p "$sites/tms-staging" /railway-test/fake /railway-test/cache
              printf "{}\n" > "$sites/tms-staging/site_config.json"
              chown -R frappe:frappe "$sites" /railway-test

              cat > /railway-test/fake/frappe.py <<PY
from pathlib import Path

class ClientCache:
    def delete_value(self, key, shared=False):
        Path("/railway-test/cache/deleted").write_text(f"{key}:{shared}\\n")

client_cache = ClientCache()

def init(site=None, sites_path=None):
    Path("/railway-test/cache/init").write_text(f"{site}:{sites_path}\\n")

def destroy():
    Path("/railway-test/cache/destroy").write_text("destroyed\\n")
PY

              runuser -u frappe -- env \
                PYTHONPATH=/railway-test/fake \
                FRAPPE_SITE=tms-staging \
                SITES_PATH="$sites" \
                FRAPPE_BENCH_ROOT=/home/frappe/frappe-bench \
                /home/frappe/frappe-bench/railway-entrypoint.sh \
                  bash -lc "echo gunicorn restored-site startup ok"

              grep -q "tms-staging:$sites" /railway-test/cache/init
              grep -q "assets_json:True" /railway-test/cache/deleted
              grep -q "destroyed" /railway-test/cache/destroy
            '
